[project]
name = "engineering-standards"
version = "1.0.1"
requires-python = ">=3.12,<3.15"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pyyaml==6.0.3",
  "ruff>=0.17,<0.18",
  "types-pyyaml>=6.0.12.20261111",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["templates", ".tools", ".validation", "adoption/checkouts", "adoption/performance-bases"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers --cov=tools --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
xfail_strict = true

[tool.coverage.run]
source = ["tools"]
branch = true
# Subprocess orchestration is verified through actual fresh-project runs.
omit = ["tools/check.py", "tools/validate_starters.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
