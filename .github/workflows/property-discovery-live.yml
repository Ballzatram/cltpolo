name: Property Discovery Live Check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/property-discovery-live.yml'
      - 'scripts/property_pipeline.py'
      - 'data/property-search-brief.json'
permissions:
  contents: read
concurrency:
  group: property-discovery-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual discovery, parsing, and repeat-run behavior without publishing
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          from urllib.parse import urlparse
          sys.path.insert(0,'scripts')
          import property_pipeline as P
          brief=P.validate_brief(json.loads(P.BRIEF.read_text()))
          original=P.LEDGER.read_bytes()
          _,rows=P.load_ledger()
          class RecordingClient(P.PublicClient):
              def __init__(self,hosts):super().__init__(hosts);self.recorded={};self.replay=False
              def get(self,url):
                  if self.replay:return self.recorded.get(url,{'ok':False,'http':None,'reason':'Not captured in live pass'})
                  result=super().get(url);self.recorded[url]=result;return result
          client=RecordingClient({urlparse(s['url']).hostname for s in brief['brokerSources']})
          checked_at=P.now_iso()
          updated,health=P.refresh(rows,brief,client,checked_at,limit=24)
          out=Path('source-diagnostic');out.mkdir(exist_ok=True)
          (out/'live-preview.json').write_text(json.dumps({'brief':brief,'properties':[r for r in updated if not P.is_audit(r)],'health':health},indent=2))
          print('LIVE SOURCE REPORT',json.dumps(health,indent=2),flush=True)
          assert health['listingsChecked']>0 and health['listingRefreshSucceeded'],'No actual individual listings parsed'
          client.replay=True
          repeated,second=P.refresh(updated,brief,client,checked_at,limit=24)
          assert second['rowsAdded']==0,'The same source response created duplicate records'
          assert second['rowsChanged']==0,'Unchanged captured source facts were reported as substantive changes'
          assert P.LEDGER.read_bytes()==original,'Live check must not write the production ledger'
          print('PASS: actual public property pages parsed; replay produced no duplicate/phantom changes; ledger not written.')
          PY
      - name: Retain the factual live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-source-live-report
          retention-days: 7
          path: source-diagnostic/live-preview.json
          if-no-files-found: warn
