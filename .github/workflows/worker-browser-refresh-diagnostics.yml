name: Worker Browser Refresh Diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/worker-browser-refresh-diagnostics.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Send one refresh request from the real site origin, with browser CORS enforced
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          endpoint='https://refresh-properties.charlottepolo-refresh.workers.dev/'
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page()
              session=page.context.new_cdp_session(page)
              session.send('Network.enable')
              requests={}
              events=[]
              def request_event(event):
                  req=event['request']
                  if urlparse(req['url']).hostname==urlparse(endpoint).hostname:
                      requests[event['requestId']]={'method':req['method'],'url':req['url']}
              def response_event(event):
                  req=requests.get(event['requestId'])
                  if req:
                      response=event['response']
                      selected={k:v for k,v in response['headers'].items() if k.lower() in ['content-type','access-control-allow-origin','access-control-allow-methods','access-control-allow-headers','cf-mitigated']}
                      events.append({**req,'status':response['status'],'headers':selected})
              session.on('Network.requestWillBeSent',request_event)
              session.on('Network.responseReceived',response_event)
              page.goto('https://charlottepolo.com/investors/',wait_until='domcontentloaded',timeout=45000)
              assert page.evaluate('location.origin')=='https://charlottepolo.com'
              print('DISPATCH TEST START',datetime.now(timezone.utc).isoformat(),flush=True)
              result=page.evaluate('''async endpoint => {
                const controller=new AbortController();
                const timer=setTimeout(()=>controller.abort(),20000);
                try {
                  const response=await fetch(endpoint,{
                    method:'POST',credentials:'omit',cache:'no-store',signal:controller.signal,
                    headers:{Accept:'application/json','Content-Type':'application/json'},
                    body:JSON.stringify({source:'investor-dashboard'})
                  });
                  const text=await response.text();
                  let message='';try{message=JSON.parse(text).message||'';}catch{message=text.slice(0,1500);}
                  return {status:response.status,message};
                }catch(error){return {error:error.name+': '+error.message};}
                finally{clearTimeout(timer);}
              }''',endpoint)
              page.wait_for_timeout(500)
              print('BROWSER NETWORK',json.dumps(events,indent=2),flush=True)
              print('BROWSER RESULT',json.dumps(result,indent=2),flush=True)
              print('No credentials were read or exposed. One POST attempted; no automatic retries and no deployment changes.',flush=True)
              browser.close()
              if result.get('status')!=202:
                  raise SystemExit('Browser dispatch was not accepted; inspect the returned message and network statuses.')
              print('Browser dispatch accepted. This does not prove source coverage, new listings, or publication completion.')
          PY
