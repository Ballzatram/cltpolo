name: Engineering Standards
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.22.3
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.7
    - name: Test the complete pinned policy implementation
      run: uv run --directory .engineering --locked --python 3.12 python tools/check.py
    - name: Check tracked documentation is UTF-8
      run: python -c "import subprocess; from pathlib import Path; names=subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split(chr(0)); suffixes={'.md','.markdown','.mkdown','.mkdn','.mkd'};
        [Path(name).read_text(encoding='utf-8') for name in names if Path(name).suffix.lower() in suffixes]"
    - name: Validate fresh isolated starters
      run: uv run --directory .engineering --locked --python 3.12 python tools/validate_starters.py
    - name: Validate pinned policy prerequisites
      run: uv run --project .engineering --locked --python 3.12 python .engineering/tools/audit.py .
    - name: Install checksum-verified secret scanner
      run: 'mkdir -p "$RUNNER_TEMP/engineering-tools"

        curl --fail --silent --show-error --location ''https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'' --output "$RUNNER_TEMP/gitleaks.tar.gz"

        echo ''551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ''"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check

        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/engineering-tools" gitleaks

        '
    - name: Scan history using trusted base rules and fingerprints
      run: python .engineering/tools/secret_scan.py --scanner "$RUNNER_TEMP/engineering-tools/gitleaks" --trusted-revision "$TRUSTED_REVISION" --candidate-revision "${{ github.sha }}"
        --bootstrap-config-sha256 b43c514c4a669a4f4463ad6958d45d0deb41e3debf86528146684685b485e760
      env:
        TRUSTED_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.22.3
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.7
    - name: Models, payment denial cases and property-source contracts (offline mocks)
      run: 'node --check script.js

        node --test tests/*.test.cjs tests/*.test.mjs

        python -m unittest discover -s tests -p ''test_property*.py'' -v

        python -m unittest discover -s tests -p ''test_generated_publication.py'' -v

        python scripts/property_pipeline.py --validate-only

        '
    - name: Pinned browser test tooling
      run: 'uv venv .engineering/.tools/browser-env

        uv pip install --python .engineering/.tools/browser-env/bin/python playwright==1.55.0

        .engineering/.tools/browser-env/bin/python -m playwright install --with-deps chromium

        '
    - name: Actual mobile and desktop pages; external mutations are mocked
      run: '.engineering/.tools/browser-env/bin/python tests/property_browser_smoke.py

        .engineering/.tools/browser-env/bin/python tests/investor_plan_memory_smoke.py

        .engineering/.tools/browser-env/bin/python tests/investor_plan_browser_smoke.py

        '
  standards-gate:
    if: ${{ always() }}
    needs:
    - policy
    - native
    - pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every selected verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: 'python3 -c ''import json,os,sys; jobs=json.loads(os.environ["RESULTS"]); sys.exit(0 if jobs and all(j["result"]=="success" for j in jobs.values()) else 1)''

        '
  pages-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
      with:
        source: ./
        destination: ./_site
'on':
  pull_request: null
  push:
    branches:
    - main
  merge_group: null
  workflow_dispatch: null
  schedule:
  - cron: 23 13 * * 1
