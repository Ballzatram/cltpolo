name: Update Property Dataset

on:
  schedule:
    - cron: "0 11 * * *" # 7 AM Eastern during daylight time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-property-dataset
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run property update agent
        run: python scripts/update_properties.py --summary-path property-refresh-summary.json

      - name: Upload refresh summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-refresh-summary
          path: property-refresh-summary.json
          if-no-files-found: ignore

      - name: Validate investor data quality gate
        run: python scripts/update_properties.py --validate-only

      - name: Commit listing dataset changes
        run: |
          git config user.name "property-research-agent"
          git config user.email "actions@github.com"

          git add data/charlotte_polo_properties.csv

          if git diff --cached --quiet; then
            echo "No listing-data changes to commit"
          else
            git commit -m "Update property dataset from refresh agent"
            git push
          fi
