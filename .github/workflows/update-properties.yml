name: Update Property Dataset
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/property_pipeline.py'
      - 'data/property-search-brief.json'
      - '.github/workflows/update-properties.yml'
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: update-property-dataset
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test research rules and pipeline
        run: |
          node --test tests/property-research*.test.cjs
          python -m unittest discover -s tests -p 'test_property*.py'
      - name: Check configured property sources
        id: research
        continue-on-error: true
        run: python scripts/property_pipeline.py --summary-path property-refresh-summary.json
      - name: Upload source health report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: property-refresh-summary
          path: property-refresh-summary.json
          if-no-files-found: warn
      - name: Validate snapshot before publication
        if: always() && steps.research.outcome != 'skipped'
        run: |
          test -s data/property-research.json
          python scripts/property_pipeline.py --validate-only
      - name: Publish results and failure reports together
        if: success() && steps.research.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: main
          UPDATE_KIND: property-snapshot
        run: |
          git config user.name 'property-research-agent'
          git config user.email 'actions@github.com'
          git add data/charlotte_polo_properties.csv data/property-research.json
          bash .github/scripts/publish-generated.sh
      - name: Keep a failed check visibly failed after publishing its report
        if: always() && steps.research.outcome == 'failure'
        run: |
          echo '::error::Research failed. Saved data and any valid failure report were retained; inspect source health.'
          exit 1
