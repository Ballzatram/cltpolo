name: Verify Property Release
on:
  push:
    branches: [main]
    paths:
      - 'investors/index.html'
      - 'property-research.js'
      - 'property-research-data.js'
      - 'property-research.css'
      - '.github/workflows/verify-property-release.yml'
permissions:
  contents: read
concurrency:
  group: verify-property-release
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed page, handoff code and snapshot
        run: |
          python - <<'PY'
          import json,time
          from urllib.request import urlopen
          origin='https://charlottepolo.com'
          def get(url):
              with urlopen(url,timeout=15) as response:
                  return response.read(2000000).decode('utf-8')
          for attempt in range(24):
              try:
                  nonce=str(time.time_ns())
                  html=get(origin+'/investors/?release-check='+nonce)
                  script=get(origin+'/property-research.js?release-check='+nonce)
                  assert 'research-release' in html and 'Run CSV Refresh Agent' not in html
                  assert 'contentsSnapshot' in script and 'dataset.completedRunId' in script
                  break
              except Exception as error:
                  print('Awaiting deployed revision:',type(error).__name__)
                  time.sleep(10)
          else:raise SystemExit('Current live revision was not observed')
          data=json.loads(get('https://raw.githubusercontent.com/Ballzatram/cltpolo/main/data/property-research.json?check='+str(time.time_ns())))
          assert data['schemaVersion']==2
          assert data['brief']['minimumAcres']==20 and data['brief']['maximumDriveMinutes']==45
          assert isinstance(data['properties'],list) and isinstance(data['health'],dict)
          print('LIVE PAGE AND HANDOFF CODE VERIFIED')
          print(json.dumps({'workflowRunId':data.get('workflowRunId'),'sourceHealth':data['health']['status'],'properties':len(data['properties']),'latestListingReviewAt':data.get('latestListingReviewAt')},indent=2))
          print('This is a read-only deployment check, not proof of a new dispatch or full market coverage.')
          print('Exact run-ID matching, stale CDN recovery and failed publication are tested in Property Research Checks.')
          PY
